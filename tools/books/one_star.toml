# Books in the "One Star" group of data/manifest.json (their pools may live in other tools/library/ dirs; see tools/build_books.py).
# Run:  python3 build_books.py one_star   (stages to books_staging/; add --promote to copy into data/)

[ranges.6x6]
Beginner  = [8, 80]   # INFERRED from current book span -- verify
Medium    = [40, 150]   # INFERRED from current book span -- verify
Hard      = [115, 225]   # INFERRED from current book span -- verify
Expert    = [190, 450]   # INFERRED from current book span -- verify

[ranges.daily]
Beginner  = [30, 80]   # INFERRED from current book span -- verify
Medium    = [65, 130]   # INFERRED from current book span -- verify
Hard      = [120, 260]   # 2026-10-12 (Josh): was 140-320, too heavy against the work-per-row ladder (books/THRESHOLDS.md); the other daily bands are kept narrow on purpose (shuffled books)
Expert    = [220, 400]   # INFERRED from current book span -- verify

[ranges.8x8]
Beginner  = [12, 85]   # INFERRED from current book span -- verify
Medium    = [40, 190]   # per user: Medium 40-190
Hard      = [125, 275]   # shell history
Expert    = [225, 500]   # shell history

[ranges.12x12]
Beginner  = [37, 120]   # 2026-10-12 work-per-row ladder (books/THRESHOLDS.md)
Medium    = [110, 255]   # 2026-10-12 work-per-row ladder (books/THRESHOLDS.md)
Hard      = [225, 425]   # 2026-10-12 work-per-row ladder (books/THRESHOLDS.md)
Expert    = [335, 795]   # 2026-10-12 work-per-row ladder (books/THRESHOLDS.md)


[ranges.6x6_mono]
Beginner  = [10, 80]   # INFERRED from current book span -- verify
Medium    = [45, 125]   # INFERRED from current book span -- verify
Hard      = [115, 225]   # INFERRED from current book span -- verify
Expert    = [190, 445]   # INFERRED from current book span -- verify

[ranges.12x12_mono]
Beginner  = [22, 105]   # INFERRED from current book span -- verify
Medium    = [150, 272]   # INFERRED from current book span -- verify
Hard      = [162, 350]   # INFERRED from current book span -- verify
Expert    = [295, 1070]   # 2026-10-13: ladder band from the pool with the heavy Experts added (library/one_star/mono_12_heavy.csv); Hard and the other tiers unchanged

[ranges.12x12_trio]
Beginner  = [46, 150]   # shell history
Medium    = [175, 300]   # INFERRED from current book span -- verify
Hard      = [225, 425]   # INFERRED from current book span -- verify
Expert    = [353, 997]   # INFERRED from current book span -- verify

