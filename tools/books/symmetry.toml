# 8x8 symmetric twin: 4 symmetry types x 750 = 3000 puzzles, each type split
# 10/40/40/10 over Beginner/Medium/Hard/Expert (the per-tier counts below are
# those of the whole book; each group's share of a tier == its share of 3000).
# Shares are in puzzles-of-3000:
#   mirror     750 (all rot90)
#   180        750 = 500 rot90 + 250 flip (flip_diag/flip_antidiag pooled)
#   diag       750 (all rot180)
#   translate  750 = 300 rot180 + 300 rot90 + 150 flip
#   t180 (translate+rot180), tmirror (translate+mirror): share 0 -- these rare groups
#   only "replace" puzzles from the 3000 (backfill), never get a target of their own.
# Short groups (e.g. diag has only 4 Expert) are level-filled from the others.
# Plus up to 2 Grandmaster per group, outside the 3000.
# Pool history: the translate / t180 / tmirror families (and ~180 diag rows) were
# salvaged from the published book into symmetric_twin.csv, rescored, and topped
# up with gen_twin_extra.py (see tools/books/TODO.md for what is still thin).

[[book]]
out    = "8x8_symmetric_twin"
source = "symmetry/symmetric_twin.csv"
ranges = "8x8"
group_by = "suffix"
groups = { mirror = ["mirror_*"], "180_rot90" = ["180_rot90"], "180_flip" = ["180_flip_*"], diag = ["diag_*"], translate_rot180 = ["translate_rot180"], translate_rot90 = ["translate_rot90"], translate_flip = ["translate_flip_*"], t180 = ["t180_*"], tmirror = ["tmirror_*"] }
shares = { mirror = 750, "180_rot90" = 500, "180_flip" = 250, diag = 750, translate_rot180 = 300, translate_rot90 = 300, translate_flip = 150, t180 = 0, tmirror = 0 }
tiers  = [
  {tier="Beginner", count=300},
  {tier="Medium", count=1200},
  {tier="Hard", count=1200},
  {tier="Expert", count=300},
]
bonus_each = { Grandmaster = 2, UNSOLVED = 1 }
notes  = "Still thin (level-filled by other groups): translate_rot180 Medium/Hard, 180_flip Expert, diag Expert. See tools/books/TODO.md"

# 8x8 symmetric MONO (single board): symmetric boards with a unique solution on their own.
# diag and 180 are the main types (equal shares); translate and ddiag are tiny pools, so share 0 =
# they only "replace" puzzles as backfill (live book: 180 55 / diag 40 / translate 7 / ddiag 1).
[[book]]
out    = "8x8_symmetric_mono"
source = "symmetry/mono_sym.csv"
ranges = "8x8"
group_by = "suffix"
groups = { diag = ["diag"], "180" = ["180"], translate = ["translate"], ddiag = ["ddiag"] }
shares = { diag = 1, "180" = 1, translate = 0, ddiag = 0 }
tiers  = [
  {tier="Beginner", count=10},
  {tier="Medium", count=40},
  {tier="Hard", count=40},
  {tier="Expert", count=10},
]
bonus_each = { Grandmaster = 1 }

# 10x10 two-star symmetric TWIN (2026-10-14); size now 1000 = 100/400/400/100 (first draft was 50/200/200/50; 2000 also builds full). Pool: library/symmetry/symmetric_twin_10x10.csv, grown
# by gen_twin_pool.py (names puzzle_<id>_<kind>_<transform>). Which kinds exist at 10x10/2 star: rot180 (95% of its twins are
# rot90, 5% flip_diag), translate (vsplit/hsplit), and thin diag / mirror; t180 and tmirror are invalid at N=10, and
# double mirror / double diagonal / rot90 produce nothing. Shares are the preferred mix: rot180 and translate carry the
# book, diag and mirror are token groups (they only exist at some difficulties), and proportional fill moves any shortfall
# onto the groups that have puzzles. The Symmetry tier is not in the book. Bands: two_star 10x10.
[ranges.10x10_symmetric_twin]
Beginner  = [70, 205]
Medium    = [190, 380]
Hard      = [310, 500]
Expert    = [335, 795]

[[book]]
out    = "10x10_symmetric_twin"
source = "symmetry/symmetric_twin_10x10.csv"
ranges = "10x10_symmetric_twin"
group_by = "suffix"
groups = { "180_rot90" = ["180_rot90"], "180_flip" = ["180_flip_*"], translate_rot180 = ["translate_rot180"], translate_rot90 = ["translate_rot90"], translate_flip = ["translate_flip_*"], diag = ["diag_*"], mirror = ["mirror_*"] }
# Two-level split (Josh, 2026-10-16): four symmetry families at 25% each. mirror and diag contribute what they can (up to
# their 25%) and never receive anyone's shortfall; whatever they can't supply goes evenly to rot180 and translate. Inside a
# family the groups split the family's count by the sub-shares below (8x8-style 2:1 for 180; 2:2:1 for translate), and a
# group short of its sub-share is made up by its siblings. (Previous flat shares, supply-driven: 180_rot90 40, 180_flip 5,
# translate_rot180 22, translate_rot90 8, translate_flip 8, diag 10, mirror 7 -> 8% backfill at size 1000.)
families = { mirror = ["mirror"], diag = ["diag"], rot180 = ["180_rot90", "180_flip"], translate = ["translate_rot180", "translate_rot90", "translate_flip"] }
family_shares = { mirror = 25, diag = 25, rot180 = 25, translate = 25 }
family_no_spill = ["mirror", "diag"]
shares = { "180_rot90" = 2, "180_flip" = 1, translate_rot180 = 2, translate_rot90 = 2, translate_flip = 1, diag = 1, mirror = 1 }
tiers  = [
  {tier="Beginner", count=100, allow_short=true},
  {tier="Medium", count=400, allow_short=true},
  {tier="Hard", count=400, allow_short=true},
  {tier="Expert", count=100, allow_short=true},
]
bonus_each = { Grandmaster = 1, UNSOLVED = 1 }
notes  = "Josh 2026-10-16: size 1000 (100/400/400/100) + bonus 'for now' (only 8% backfilled; 2000 would be 14%, 3000 18%). Token diag / mirror / translate_flip groups are fine. Pool grown overnight 2026-10-15/16 to 16.7k rows; bigger sizes are possible (the 2000 version builds full)."

# 9x9 two-star one-board symmetric (2026-10-14). Pool: library/symmetry/mono_sym_9x9.csv, grown by gen_sym9_mono.py.
# Only rot180 (suffix 180), diagonal (diag), translate and t180 can have a unique solution at 9x9/2 star. The Symmetry
# tier is deliberately not in the book (Josh). 180 is plentiful; diag and translate are rare, so the shares are only
# the preferred mix and 180 fills what they can't supply. Bands: same as 9x9_symmetric / two_star 9x9.
[ranges.9x9_symmetric_mono]
