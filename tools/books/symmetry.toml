Medium    = [160, 315]
Hard      = [310, 465]
Expert    = [380, 745]

[[book]]
out    = "9x9_symmetric_mono"
source = "symmetry/mono_sym_9x9.csv"
ranges = "9x9_symmetric_mono"
group_by = "suffix"
groups = { "180" = ["180"], diag = ["diag"], translate = ["translate"] }     # t180 dropped (Josh, 2026-10-14)
