source = "regionless/10x10_symmetric_complement.csv"
ranges = "10x10_complement"
group_by = "suffix"
# Split by symmetry, rejoined in thirds: {(180, 90), lr, t}. 90 counts as a subset of 180 (rot90
# implies rot180), and within that first third 180 gets 75 percent and 90 gets 25 percent.
# Shares are out of 12: 180 = 3, 90 = 1, lr = 4, t = 4.
groups = { "180" = ["180"], "90" = ["90"], lr = ["lr"], t = ["t"] }
shares = { "180" = 3, "90" = 1, lr = 4, t = 4 }
tiers  = [
  {tier="Beginner", count=250},
  {tier="Hard", count=250, allow_short=true},
]
unsolved_extremes = true
notes  = "Round sizes (Josh, 2026-10-11): 250 Beginner / 250 Hard. The matched Hard band holds 292 puzzles."

