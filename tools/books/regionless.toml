[[book]]
out    = "6x6_regionless_expert"
source = "regionless/6x6.csv"
ranges = "6x6"
group_by = "suffix"
# Split by the Expert rule the solve needs (suffixes from tag_expert_rules.py; rerun it after any rescore of the pool):
# ra = region algebra, tpq = tile pair quota fill, ls3 = 3-row/col line sync, ratpq = region algebra AND tile pair quota fill (a
# gem: only 193 exist, so nearly all go in), gm = Grandmaster rows (share 0: only the bonus rows draw from it).
groups = { ra = ["ra"], tpq = ["tpq"], ls3 = ["ls3"], ratpq = ["ratpq"], gm = ["gm"] }
shares = { ra = 27, tpq = 27, ls3 = 27, ratpq = 19, gm = 0 }
tiers  = [ {tier="Expert", count=500} ]
bonus  = { Grandmaster = 5 }

[[book]]
out    = "6x6_regionless_hard"
source = "regionless/6x6.csv"
ranges = "6x6"
tier   = "Hard"
count  = 1000

[[book]]
out    = "8x8_regionless_beginner"
source = "regionless/8x8.csv"
ranges = "8x8"
tier   = "Beginner"
count  = 1000

[[book]]
out    = "8x8_regionless_expert"
source = "regionless/8x8.csv"
ranges = "8x8"
group_by = "suffix"
# Split by the Expert rule(s) the solve needs (suffixes from tag_expert_rules.py; rerun it after any rescore of the pool):
# single-rule groups ra = region algebra, tpq = tile pair quota fill, ls3 = 3-row/col line sync; multi-rule groups are the rare
# combinations (ls3ra, ratpq, ls3tpq, ls3ratpq), which get big shares so that every one of them in the score range goes in and the
# three single-rule groups split the rest. gm / uns = the Grandmaster / UNSOLVED rows (share 0: only the bonus rows draw from them).
groups = { ra = ["ra"], tpq = ["tpq"], ls3 = ["ls3"], ls3ra = ["ls3ra"], ratpq = ["ratpq"], ls3tpq = ["ls3tpq"], ls3ratpq = ["ls3ratpq"], gm = ["gm"], uns = ["uns"] }
shares = { ra = 21, tpq = 21, ls3 = 21, ls3ra = 15, ratpq = 15, ls3tpq = 3, ls3ratpq = 3, gm = 0, uns = 0 }
tiers  = [ {tier="Expert", count=750} ]     # Josh 2026-10-12: 750 + bonuses (the multi-rule groups are too small in the new band for 1,000)
bonus  = { Grandmaster = 5 }
unsolved_extremes = true

[[book]]
out    = "8x8_regionless_hard"
source = "regionless/8x8.csv"
ranges = "8x8"
tier   = "Hard"
count  = 1000

