# Books in the "Rectangles" group of data/manifest.json (their pools may live in other tools/library/ dirs; see tools/build_books.py).
# Run:  python3 build_books.py rectangles   (stages to books_staging/; add --promote to copy into data/)

[ranges.mondrian]
Beginner  = [14, 85]   # shell history
Medium    = [40, 190]   # shell history
Hard      = [125, 275]   # INFERRED from current book span -- verify
Expert    = [190, 500]   # pool Experts span 127-723; this takes the 190-500 band

[ranges.quadrants]
Beginner  = [14, 85]   # shell history
Medium    = [40, 190]   # shell history
Hard      = [125, 275]   # shell history
Expert    = [225, 500]   # shell history

[ranges.not_sudoku_2star]   # 2026-10-12 work-per-row ladder (books/THRESHOLDS.md)
Beginner  = [70, 175]
Medium    = [200, 330]
Hard      = [330, 480]
Expert    = [395, 775]

[ranges.not_sudoku]
Beginner  = [14, 85]   # shell history (same as the other 8x8-style rectangles books)
Medium    = [40, 190]   # shell history
Hard      = [125, 275]   # shell history
Expert    = [225, 500]   # shell history

[ranges.venn]
Beginner  = [13, 85]   # INFERRED from current book span -- verify
Medium    = [40, 190]   # shell history
Hard      = [125, 275]   # INFERRED from current book span -- verify
Expert    = [225, 500]   # INFERRED from current book span -- verify

[ranges.mondrian_2star]   # same 10x10 2-star bands as venn_2star (books/two_star.toml)
Beginner  = [70, 205]
Medium    = [190, 380]
Hard      = [310, 500]
Expert    = [335, 795]

[ranges.mondrian_2star_mono]   # 1-board 10x10 2-star bands (books/two_star.toml 10x10_mono)
Beginner  = [75, 160]
Medium    = [170, 325]
Hard      = [290, 480]
Expert    = [375, 790]

[ranges.venn_2star]   # 10x10 2-star bands from books/two_star.toml
Beginner  = [70, 205]
Medium    = [190, 380]
Hard      = [310, 500]
Expert    = [335, 795]

[[book]]
out    = "mondrian"
source = "rectangles/modrian_scored.csv"
ranges = "mondrian"
tiers  = [
  {tier="Beginner", count=100},
  {tier="Medium", count=400},
  {tier="Hard", count=400},
  {tier="Expert", count=100},
]
bonus  = { Grandmaster = 5 }
notes  = "Back to the standard 100/400/400/100 + 5 Grandmasters: the pool now has 439 Experts (2026-10-11 all-pairs run, see README: Mondrian Expert generation)."

[[book]]
out    = "quadrants"
source = "rectangles/quads_scored.csv"
ranges = "quadrants"
tiers  = [
  {tier="Beginner", count=100},
  {tier="Medium", count=400},
  {tier="Hard", count=400},
  {tier="Expert", count=100},
]
bonus  = { Grandmaster = 5 }

[[book]]
out    = "not_sudoku_2star"
source = "rectangles/two_star_sudoku.csv"
ranges = "not_sudoku_2star"
tiers  = [
  {tier="Beginner", count=100},
  {tier="Medium", count=400},
  {tier="Hard", count=400},
  {tier="Expert", count=100},
]
bonus  = { Grandmaster = 5, UNSOLVED = 5 }

[[book]]
out    = "not_sudoku"
source = "rectangles/one_star_sudoku.csv"
ranges = "not_sudoku"
tiers  = [
  {tier="Beginner", count=100},
  {tier="Medium", count=400},
  {tier="Hard", count=400},
  {tier="Expert", count=100},
]
bonus  = { Grandmaster = 5 }
notes  = "Source pool = salvaged live book (rescored) + 4500 sudoku_pair 9x9 1-star top-ups. Full in every tier; Expert margin is thin (112 candidates for 100)."

[[book]]
out    = "venn"
source = "playground/venn_scored.csv"
ranges = "venn"
tiers  = [
  {tier="Beginner", count=100},
  {tier="Medium", count=400},
  {tier="Hard", count=400},
  {tier="Expert", count=100},
]
bonus  = { Grandmaster = 5 }
notes  = "Standard 100/400/400/100 + 5 Grandmasters. The pool was grown 2026-10-11 by an all-pairs run (gen_allpairs.py, 3.8M of 14.4M possible pairs scored: +1983 Expert, +675 Grandmaster, +24.5k Hard); before that it had 66 Experts."

[[book]]
out    = "venn_2star"
source = "playground/venn2star_10_big_scored.csv"
ranges = "venn_2star"
tiers  = [
  {tier="Beginner", count=100},
  {tier="Medium", count=400},
  {tier="Hard", count=400},
  {tier="Expert", count=100},
]
bonus  = { Grandmaster = 5, UNSOLVED = 5 }
notes  = "10x10 2-star venn (VennGenerator min_region_size=3, venn2star_boards.py + venn2star_pairs.py, 2026-10-18; pool of 18k pairs from ~2,000 boards, rotation/reflection duplicates removed). Boards repeat across puzzles (one board up to ~19x) -- accepted. Expert has only ~386 candidates for 100."

[[book]]
out    = "mondrian_2star"
source = "rectangles/mondrian_2star_scored.csv"
ranges = "mondrian_2star"
tiers  = [
  {tier="Beginner", count=100},
  {tier="Medium", count=400},
  {tier="Hard", count=400},
  {tier="Expert", count=100},
]
bonus  = { Grandmaster = 5, UNSOLVED = 5 }
notes  = "10x10 2-star mondrian (SubdivisionGenerator min_region_size=3, mondrian2star_boards.py + mondrian2star_pairs.py, 2026-10-25). Pool = random 5,000-puzzle sample of 286k pairs from 5,000 boards."

[[book]]
out    = "mondrian_2star_mono"
source = "rectangles/mondrian_2star_mono_scored.csv"
ranges = "mondrian_2star_mono"
tiers  = [
  {tier="Beginner", count=10},
  {tier="Medium", count=40},
  {tier="Hard", count=40},
  {tier="Expert", count=10},
]
bonus  = { Grandmaster = 1, UNSOLVED = 1 }
notes  = "Token 1-board 10x10 2-star mondrian: boards from mondrian2star_boards.py whose rectangle layout has exactly one solution (264 from the first pilot). 10% the size of mondrian_2star. Pool grown 2026-10-25 to 3,547 boards by mondrian_mono_boards.py (10 min search, 6.3k hits ~3.3k distinct; the space looks nearly saturated)."
