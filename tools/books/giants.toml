# Books in the "Giants" group of data/manifest.json (their pools may live in other tools/library/ dirs; see tools/build_books.py).
# Run:  python3 build_books.py giants   (stages to books_staging/; add --promote to copy into data/)

[ranges.17x17_mono]   # 2026-10-12: work-per-row ladder bands (books/THRESHOLDS.md)
Beginner  = [250, 605]   # lower edge = the pool minimum (Josh, 2026-10-12: gentle intro for the big boards)
Medium    = [375, 725]
Hard      = [790, 1085]
Expert    = [930, 1575]

[ranges.17x17]   # 2026-10-21: threshold_ladder.py bands for the 2-board pool
Beginner  = [180, 310]   # lower edge = the pool minimum, upper = the Medium lower edge (ladder rule gave only 225-265)
Medium    = [310, 530]
Hard      = [600, 1225]
Expert    = [1020, 2300]   # widened for supply

[ranges.21x21]   # 2026-10-22: threshold_ladder.py bands for the 2-board pool
Beginner  = [340, 500]   # lower edge = the pool minimum, upper = the Medium lower edge (ladder rule gave only 380-420)
Medium    = [500, 780]
Hard      = [890, 1635]
Expert    = [1155, 3560]   # widened for supply

[ranges.21x21_mono]   # 2026-10-12: work-per-row ladder bands (books/THRESHOLDS.md)
Beginner  = [360, 620]   # lower edge = the pool minimum (Josh, 2026-10-12: gentle intro for the big boards)
Medium    = [620, 970]
Hard      = [1010, 1405]
Expert    = [1160, 1985]

[ranges.25x25]   # 2026-10-23: threshold_ladder.py bands for the 2-board pool (re-derived after the unbiased Expert growth)
Beginner  = [515, 695]   # lower edge = the pool minimum, upper = the Medium lower edge (ladder rule gave only 575-625)
Medium    = [695, 1020]
Hard      = [1165, 2155]
Expert    = [1150, 8000]   # ladder band is 1370-3035 (only ~51 puzzles); widened for supply, as for 17x17 and 21x21: lower edge 1150, no upper cap

[ranges.25x25_mono]   # 2026-10-12: work-per-row ladder bands (books/THRESHOLDS.md)
Beginner  = [550, 830]   # lower edge = the pool minimum (Josh, 2026-10-12: gentle intro for the big boards)
Medium    = [820, 1270]
Hard      = [1330, 1830]
Expert    = [1470, 2570]

[ranges.20x20]
Beginner  = [85, 275]   # kept 2026-10-12: the pool holds only 193 Beginners for 100 wanted
Medium    = [170, 350]   # 2026-10-12 work-per-row ladder (books/THRESHOLDS.md)
Hard      = [370, 690]   # 2026-10-12 work-per-row ladder (books/THRESHOLDS.md)
Expert    = [545, 1310]   # 2026-10-12 work-per-row ladder (books/THRESHOLDS.md)

[ranges.20x20_mono]
Beginner  = [38, 133]   # INFERRED from current book span -- verify
Medium    = [80, 255]   # INFERRED from current book span -- verify
Hard      = [140, 300]   # INFERRED from current book span -- verify
Expert    = [465, 1375]   # 2026-10-13: ladder band from the pool with the heavy Experts added (library/giants/giant_heavy.csv); Hard and the other tiers unchanged

[[book]]
out    = "17x17"
source = "giants/17x17_pair.csv"
ranges = "17x17"
tiers  = [
  {tier="Beginner", count=1000},
  {tier="Medium", count=500},
  {tier="Hard", count=250},
  {tier="Expert", count=250},
]
bonus  = { Grandmaster = 5, UNSOLVED = 5 }
notes  = "17x17 4-star, two boards (every board required). Pool from tools/gen_multi_board.py with a 1 s star-placement budget: small_region_frac 0.4 for Beginner/Medium/Hard, plus unbiased growth for Expert and up."

