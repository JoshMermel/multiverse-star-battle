# Books in the "Playground" group of data/manifest.json (their pools may live in other tools/library/ dirs; see tools/build_books.py).
# Run:  python3 build_books.py playground   (stages to books_staging/; add --promote to copy into data/)

[ranges.8x8]
Beginner  = [14, 85]   # shell history
Medium    = [40, 190]   # shell history
Hard      = [125, 275]   # shell history
Expert    = [225, 500]   # shell history

[ranges.6x6_square_free]
Beginner  = [10, 80]   # INFERRED from current book span -- verify
Medium    = [40, 150]   # INFERRED from current book span -- verify
Hard      = [115, 225]   # INFERRED from current book span -- verify
Expert    = [190, 450]   # INFERRED from current book span -- verify

[ranges.9x9_square_free]   # 2026-10-12 work-per-row ladder (books/THRESHOLDS.md)
Beginner  = [55, 170]
Medium    = [175, 330]
Hard      = [345, 510]
Expert    = [400, 760]

[ranges.6x6_equal_area]
Medium    = [55, 150]   # INFERRED from current book span -- verify
Hard      = [115, 225]   # INFERRED from current book span -- verify
Expert    = [190, 450]   # INFERRED from current book span -- verify

[ranges.9x9_equal_area]
Medium    = [160, 320]   # 9x9 2-star Medium range (the family has only 2 Medium puzzles: 266, 299)
Hard      = [300, 720]   # widened from [300,600] to include ALL 17 Hard puzzles (333-701)
Expert    = [300, 1950]  # wide on purpose: equal-area Experts score 316-1984

[ranges.9x9_square_free_mono]   # 2026-10-12 work-per-row ladder (books/THRESHOLDS.md)
Beginner  = [55, 155]
Medium    = [155, 300]
Hard      = [290, 455]
Expert    = [345, 715]

