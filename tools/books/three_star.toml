# Books in the "Three Star" group of data/manifest.json (their pools may live in other tools/library/ dirs; see tools/build_books.py).
# Run:  python3 build_books.py three_star   (stages to books_staging/; add --promote to copy into data/)

[ranges.13x13]   # 2026-10-12: work-per-row ladder bands (books/THRESHOLDS.md)
Beginner  = [115, 250]
Medium    = [210, 520]
Hard      = [555, 775]
Expert    = [645, 1185]

[ranges.14x14]   # 2026-10-12: work-per-row ladder bands (books/THRESHOLDS.md)
Beginner  = [150, 270]
Medium    = [275, 525]
Hard      = [510, 770]
Expert    = [655, 1385]


[ranges.13x13_mono]   # 2026-10-12: work-per-row ladder bands (books/THRESHOLDS.md)
Beginner  = [125, 235]
Medium    = [240, 445]
Hard      = [480, 695]
Expert    = [570, 1095]

[ranges.14x14_mono]   # 2026-10-12: work-per-row ladder bands (books/THRESHOLDS.md)
